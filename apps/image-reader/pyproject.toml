[project]
name = "rpgtl-image-text"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.119.1",
  "uvicorn==0.38.0",
  "pillow==12.0.0",
  "numpy==2.2.6",
  # Box detection and cropping must match PaddleX's, which ran on OpenCV 4.10; 5.0 reads lines differently.
  "opencv-python-headless==4.10.0.84",
  "pyclipper==1.3.0.post6",
]

[project.optional-dependencies]
cpu = ["onnxruntime==1.31.1"]
gpu = ["onnxruntime-gpu[cuda,cudnn]==1.31.1"]
# Windows only. Its last release is behind the other two packages.
directml = ["onnxruntime-directml==1.24.4; sys_platform == 'win32'"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }, { extra = "directml" }]]
