packages:
  - .
  - apps/*
  - packages/*
# Claude Code and Codex are the user's own installs, which RPGTL finds on PATH.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
patchedDependencies:
  "@hyrious/marshal@0.3.4": patches/@hyrious__marshal@0.3.4.patch
